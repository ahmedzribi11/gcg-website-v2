# Propositions de mises à jour des dépendances (SEC-09), une fois par mois.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      tooling:
        patterns: ['tailwindcss', '@tailwindcss/*', 'typescript', '@types/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

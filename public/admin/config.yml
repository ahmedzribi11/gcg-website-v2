# Espace de gestion GCG (Decap CMS) — https://decapcms.org/docs/
# Les listes de choix (secteurs, statuts, villes, expertises, typologies) doivent rester
# identiques à celles de src/content.config.ts. Le build refuse tout contenu incomplet
# (scripts/check-content.mjs et schéma src/content.config.ts).

backend:
  name: github
  repo: ahmedzribi11/gcg-website-v2
  branch: main
  auth_endpoint: api/auth
  # Dépôt public : accès aux seuls dépôts publics de l’éditeur (SEC-03). À passer à « repo » si le dépôt devient privé.
  auth_scope: public_repo
  # preview_context volontairement absent (OPS-04) : Decap lit l’adresse d’aperçu dans le statut de commit GitHub,
  # et celui de Vercel (contexte « Vercel ») pointe vers le tableau de bord vercel.com, pas vers l’aperçu ; Decap y
  # ajouterait le chemin de la fiche, d’où un lien cassé. À activer seulement avec un hébergeur dont le statut porte
  # l’adresse de l’aperçu. Garde-fou réel : le contrôle « Qualité » requis sur main (GATE-03) bloque la publication
  # d’une fiche refusée par le build.
  commit_messages:
    create: 'Projet ajouté : {{slug}}'
    update: 'Mise à jour : {{slug}}'
    delete: 'Suppression : {{slug}}'
    uploadMedia: 'Image ajoutée : {{path}}'
    deleteMedia: 'Image supprimée : {{path}}'

# Brouillon → En cours de révision → Prêt : chaque modification est un brouillon tant qu’elle n’est pas publiée
publish_mode: editorial_workflow
show_preview_links: true

# En local : « npm run cms » puis http://localhost:4321/admin
local_backend: true

locale: fr
logo_url: /brand/gcg-logo-green.png
media_folder: public/uploads
public_folder: /uploads
slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: projects
    label: Réalisations
    label_singular: projet
    description: >-
      Ne renseigner que des informations confirmées par GCG : un champ laissé vide n’est pas affiché.
      Une publication met le site à jour en quelques minutes ; un projet incomplet est refusé avec un message.
    folder: src/content/projects
    extension: json
    format: json
    create: true
    delete: false
    identifier_field: name
    slug: '{{slug}}'
    summary: 'N° {{number}} — {{name}} · {{location}}'
    sortable_fields:
      - { field: number, label: 'N°', default_sort: asc }
      - { field: name, label: Nom }
    preview_path: 'realisations/{{filename}}'
    view_groups:
      - { label: Secteur, field: sector }
      - { label: Statut, field: status }
      - { label: Autorisation, field: permission }
      - { label: 'Version anglaise', field: en_status }
    # Images enregistrées dans le dossier du projet, optimisées automatiquement au déploiement
    media_folder: /src/assets/projects/{{slug}}
    public_folder: ../../assets/projects/{{slug}}
    editor:
      preview: false
    fields:
      - { label: 'N° d’ordre', name: number, widget: number, value_type: int, min: 1, hint: 'Ordre d’affichage. Ex. : 35 pour le projet suivant le n° 34.' }
      - { label: 'Nom du projet', name: name, widget: string, hint: 'Ex. : Villa Palmeras' }
      - { label: 'Nom en anglais', name: name_en, widget: string, required: false, hint: 'Seulement si le nom change en anglais. Ex. : Cashew processing plant' }
      - label: Secteur
        name: sector
        widget: select
        hint: 'Ex. : Hôtellerie & tourisme pour un hôtel ou un spa'
        options:
          - { label: 'Résidentiel & bureaux', value: residentiel }
          - { label: 'Hôtellerie & tourisme', value: hotellerie }
          - { label: 'Équipements & loisirs', value: equipements }
          - { label: 'Industrie & infrastructures', value: industrie }
      - label: Ville
        name: city
        widget: select
        hint: 'Sert aux filtres et à la carte. Pour une ville absente de la liste, contacter le webmaster.'
        options:
          - { label: 'Abidjan', value: abidjan }
          - { label: 'Grand-Bassam', value: grand-bassam }
          - { label: 'Assinie', value: assinie }
          - { label: 'Assouindé', value: assouinde }
          - { label: 'Korhogo', value: korhogo }
          - { label: 'Attingué', value: attingue }
          - { label: 'Anyama', value: anyama }
          - { label: 'Bingerville', value: bingerville }
          - { label: 'Songon', value: songon }
          - { label: 'Dabou', value: dabou }
          - { label: 'Jacqueville', value: jacqueville }
          - { label: 'Bonoua', value: bonoua }
          - { label: 'Aboisso', value: aboisso }
          - { label: 'Yamoussoukro', value: yamoussoukro }
          - { label: 'Bouaké', value: bouake }
          - { label: 'Daloa', value: daloa }
          - { label: 'Man', value: man }
          - { label: 'San-Pédro', value: san-pedro }
          - { label: 'Abengourou', value: abengourou }
      - { label: 'Lieu (texte affiché)', name: location, widget: string, hint: 'Ex. : Abidjan, Riviera Golf' }
      - { label: 'Lieu en anglais', name: location_en, widget: string, required: false, hint: 'Seulement s’il diffère. Ex. : Abidjan, Riviera Golf' }
      - { label: Période, name: period, widget: string, hint: 'Année de livraison ou période. Ex. : 2024 – 2025' }
      - { label: 'Période en anglais', name: period_en, widget: string, required: false, hint: 'Ex. : 2024 – 2025' }
      - label: Statut
        name: status
        widget: select
        required: false
        hint: 'Laisser vide si le statut n’est pas confirmé par GCG.'
        options:
          - { label: 'En cours d’exécution', value: execution }
          - { label: 'En cours d’études', value: etudes }
          - { label: 'Réceptionné', value: receptionne }
      - { label: 'Mission d’études seulement', name: designOnly, widget: boolean, default: false, required: false, hint: 'Cocher si GCG n’a fait que des études, de la conception ou un dossier de permis, sans travaux. Le projet porte alors la mention « Études uniquement », pour ne pas passer pour un ouvrage construit par GCG.' }
      - { label: 'Surface', name: surface, widget: string, required: false, hint: 'Ex. : 2 500 m²' }
      - { label: 'Terrain', name: terrain, widget: string, required: false, hint: 'Ex. : 6 ha' }
      - { label: 'Surface couverte', name: coveredSurface, widget: string, required: false, hint: 'Ex. : 12 000 m²' }
      - { label: 'Durée du chantier', name: duration, widget: string, required: false, hint: 'Facultatif, seulement si GCG la confirme. Ex. : 18 mois' }
      - { label: 'Durée du chantier en anglais', name: duration_en, widget: string, required: false, hint: 'Requise si la durée est remplie et la version anglaise « validée ». Ex. : 18 months' }
      - { label: 'Effectif au plus fort', name: workforce, widget: number, value_type: int, min: 1, required: false, hint: 'Facultatif : nombre de personnes sur le chantier au plus fort, seulement si GCG le confirme. Ex. : 45' }
      - { label: 'Résumé (français)', name: composition, widget: text, pattern: ['^[\s\S]{1,300}$', '300 caractères maximum'], hint: 'Une à deux phrases, 300 caractères maximum. Ex. : Construction d’une cité de 45 villas haut standing.' }
      - { label: 'Résumé (anglais)', name: composition_en, widget: text, required: false, pattern: ['^[\s\S]{0,300}$', '300 caractères maximum'], hint: 'Requis si la version anglaise est « validée ». Ex. : Construction of an estate of 45 high-end villas.' }
      - label: 'Récit du projet'
        name: story
        widget: object
        required: false
        collapsed: true
        hint: 'Facultatif : trois paragraphes courts affichés sur la fiche, seulement ceux qui sont remplis. N’écrire que des faits confirmés par GCG. Pour le retirer, vider tous ses champs.'
        fields:
          - { label: 'Le besoin', name: need, widget: text, required: false, pattern: ['^[\s\S]{0,700}$', '700 caractères maximum'], hint: 'Ce que le client demandait et ses contraintes (terrain, délai, budget).' }
          - { label: 'Le besoin (anglais)', name: need_en, widget: text, required: false, pattern: ['^[\s\S]{0,700}$', '700 caractères maximum'], hint: 'Requis si « Le besoin » est rempli et la version anglaise « validée ».' }
          - { label: 'Ce que GCG a fait', name: work, widget: text, required: false, pattern: ['^[\s\S]{0,700}$', '700 caractères maximum'], hint: 'Les missions réellement assurées par GCG, sans revendiquer celles des autres intervenants.' }
          - { label: 'Ce que GCG a fait (anglais)', name: work_en, widget: text, required: false, pattern: ['^[\s\S]{0,700}$', '700 caractères maximum'], hint: 'Requis si « Ce que GCG a fait » est rempli et la version anglaise « validée ».' }
          - { label: 'Le résultat', name: result, widget: text, required: false, pattern: ['^[\s\S]{0,700}$', '700 caractères maximum'], hint: 'Ce qui a été livré, et quand.' }
          - { label: 'Le résultat (anglais)', name: result_en, widget: text, required: false, pattern: ['^[\s\S]{0,700}$', '700 caractères maximum'], hint: 'Requis si « Le résultat » est rempli et la version anglaise « validée ».' }
      - label: Typologies
        label_singular: typologie
        name: typologies
        widget: list
        required: false
        summary: '{{fields.name}} — {{fields.surface}}'
        fields:
          - { label: Nom, name: name, widget: string, hint: 'Ex. : Villa Minan' }
          - { label: Surface, name: surface, widget: string, hint: 'Ex. : 204 m²' }
      - { label: 'Typologie (texte libre)', name: typology, widget: string, required: false, hint: 'Ex. : Villas R+1 de 4 et 5 pièces' }
      - { label: 'Typologie en anglais', name: typology_en, widget: string, required: false }
      - { label: 'Missions GCG (français)', label_singular: mission, name: missions, widget: list, min: 1, field: { label: Mission, name: mission, widget: string, hint: 'Ex. : Gros œuvre et second œuvre' } }
      - { label: 'Missions GCG (anglais)', label_singular: 'mission (anglais)', name: missions_en, widget: list, required: false, hint: 'Au moins une mission si la version anglaise est « validée ».', field: { label: Mission, name: mission, widget: string, hint: 'Ex. : Structural and finishing works' } }
      - label: Expertises mobilisées
        name: services
        widget: select
        multiple: true
        required: false
        hint: 'Le projet apparaît sur la page de chaque expertise cochée. Ex. : Construction, Aménagement'
        options:
          - { label: 'Études & faisabilité', value: etudes }
          - { label: 'Architecture & conception', value: architecture }
          - { label: 'Ingénierie', value: ingenierie }
          - { label: 'Construction', value: construction }
          - { label: 'Aménagement', value: amenagement }
          - { label: 'Rénovation & mise à niveau', value: rehabilitation }
          - { label: 'Infrastructures & VRD', value: infrastructures }
          - { label: 'Clé en main', value: cle-en-main }
      - label: Typologies de bâtiment
        name: types
        widget: select
        multiple: true
        required: false
        hint: 'Ex. : Villas, Résidences'
        options:
          - { label: 'Villas', value: villas }
          - { label: 'Résidences', value: residences }
          - { label: 'Immeubles', value: immeubles }
          - { label: 'Hôtels', value: hotels }
          - { label: 'Loisirs', value: loisirs }
          - { label: 'Usines', value: industrie }
          - { label: 'Équipements', value: equipements }
          - { label: 'Infrastructures', value: infrastructures }
      - label: Photos
        label_singular: photo
        name: images
        widget: list
        min: 1
        summary: '{{fields.alt}}'
        hint: 'La première image sert de couverture ; glisser pour réordonner. Photo d’origine (JPG, PNG ou HEIC d’iPhone, 20 Mo maximum), 2 400 px de large idéalement : le site la convertit et l’optimise automatiquement.'
        fields:
          - { label: Image, name: src, widget: image, choose_url: false }
          - { label: 'Description (français)', name: alt, widget: string, pattern: ['^.{5,140}$', '5 à 140 caractères'], hint: 'Ce que montre l’image, pour les malvoyants et Google, 5 à 140 caractères. Ex. : Villa Palmeras, façade principale et piscine' }
          - { label: 'Description (anglais)', name: alt_en, widget: string, pattern: ['^.{5,140}$', '5 à 140 caractères'], hint: 'Requise même si la version anglaise est « à traduire », 5 à 140 caractères. Ex. : Villa Palmeras, main façade and pool' }
          - label: Nature
            name: kind
            widget: select
            default: photo
            hint: 'Le site affiche « Perspective » ou « Plan » sur l’image. Choisir « Perspective 3D » pour toute image de synthèse et « Plan » pour un dessin : une perspective ne doit jamais passer pour une photo réelle.'
            options:
              - { label: 'Photo réelle', value: photo }
              - { label: 'Perspective 3D (rendu)', value: render }
              - { label: 'Plan ou dessin', value: plan }
          - { label: 'Point focal', name: focus, widget: string, required: false, pattern: ['^\d{1,3}% \d{1,3}%$', 'Format : 50% 30%'], hint: 'Facultatif : partie à garder visible au recadrage. Ex. : 50% 30% (centre, haut)' }
      - label: Autorisation de publication
        name: permission
        widget: select
        default: en-attente
        hint: 'Accord du client final pour montrer ce projet (un e-mail suffit). « En attente » : projet masqué lors du lancement.'
        options:
          - { label: 'En attente (non publié au lancement)', value: en-attente }
          - { label: 'Autorisation du client obtenue', value: obtenue }
          - { label: 'Autorisation non requise', value: non-requise }
      - label: Version anglaise
        name: en_status
        widget: select
        default: a-traduire
        hint: 'Un nouveau projet reste « à traduire » : il n’apparaît en anglais qu’après relecture. « Validée » exige le résumé et au moins une mission en anglais.'
        options:
          - { label: 'Version anglaise relue et validée', value: valide }
          - { label: 'À traduire (non publiée en anglais)', value: a-traduire }
      - { label: 'Mettre en avant sur l’accueil', name: featured, widget: boolean, default: false, required: false, hint: 'Projets phares : hôtels, grands ensembles.' }
      - { label: 'Ordre sur l’accueil', name: featuredOrder, widget: number, value_type: int, required: false, hint: 'Ex. : 1 pour le premier' }
      - label: 'Chiffre clé sur l’accueil'
        name: highlight
        widget: object
        required: false
        collapsed: true
        hint: 'Facultatif : un chiffre tiré de cette fiche, affiché dans la grille « À toutes les échelles » et/ou le bandeau des chiffres clés sous l’ouverture de l’accueil (4 au plus). Il disparaît si le projet n’est pas publié. Pour le retirer, vider tous ses champs.'
        fields:
          - { label: Valeur, name: value, widget: string, required: false, hint: 'Requise dès qu’un champ du chiffre clé est rempli. Ex. : 116 ou 55 000' }
          - { label: Unité, name: unit, widget: string, required: false, hint: 'Requise dès qu’un champ du chiffre clé est rempli. Ex. : villas' }
          - { label: 'Unité en anglais', name: unit_en, widget: string, required: false, hint: 'Seulement si elle change en anglais. Ex. : rooms' }
          - { label: Précision, name: note, widget: string, required: false, hint: 'Affichée sous le chiffre dans la grille. Ex. : R+1 haut standing sur 6 ha' }
          - { label: 'Précision en anglais', name: note_en, widget: string, required: false, hint: 'Requise si la précision est remplie et la version anglaise « validée ». Ex. : high-end R+1 villas on 6 ha' }
          - { label: 'Rang dans la grille « À toutes les échelles »', name: scaleOrder, widget: number, value_type: int, min: 1, required: false, hint: 'Vide : absent de la grille. Ex. : 1 pour le premier' }
          - { label: 'Rang dans le bandeau des chiffres clés', name: marqueeOrder, widget: number, value_type: int, min: 1, required: false, hint: 'Vide : absent du bandeau. Seuls les 4 premiers rangs sont affichés. Ex. : 1 pour le premier' }
          - { label: 'Nom dans le bandeau', name: marqueeName, widget: string, required: false, hint: 'Laisser vide de préférence : le nom du projet s’affiche alors, écrit comme partout ailleurs sur le site.' }
          - { label: 'Nom dans le bandeau en anglais', name: marqueeName_en, widget: string, required: false, hint: 'Par défaut : le nom ci-dessus, sinon le nom en anglais du projet' }
          - { label: 'Texte du bandeau', name: marqueeFigure, widget: string, required: false, hint: 'Par défaut : valeur et unité. Ex. : 64 bungalows & 30 villas' }
          - { label: 'Texte du bandeau en anglais', name: marqueeFigure_en, widget: string, required: false, hint: 'Requis si le texte du bandeau est rempli et la version anglaise « validée ».' }
      - { label: 'Titre Google (français)', name: seo_title, widget: string, required: false, pattern: ['^.{0,70}$', '70 caractères maximum'], hint: 'Facultatif : remplace le titre de l’onglet et du résultat Google. 60 caractères conseillés, 70 au plus. Par défaut : « Nom du projet · projet GCG, Côte d’Ivoire ».' }
      - { label: 'Titre Google (anglais)', name: seo_title_en, widget: string, required: false, pattern: ['^.{0,70}$', '70 caractères maximum'], hint: 'Facultatif, pour la page anglaise. 60 caractères conseillés, 70 au plus.' }
      - { label: 'Description Google (français)', name: seo_description, widget: text, required: false, pattern: ['^[\s\S]{0,170}$', '170 caractères maximum'], hint: 'Facultatif : remplace la description du résultat Google. 160 caractères conseillés, 170 au plus. Par défaut : le résumé, suivi du lieu et de la période.' }
      - { label: 'Description Google (anglais)', name: seo_description_en, widget: text, required: false, pattern: ['^[\s\S]{0,170}$', '170 caractères maximum'], hint: 'Facultatif, pour la page anglaise. 160 caractères conseillés, 170 au plus.' }

  - name: settings
    label: Paramètres
    description: 'Coordonnées, réseaux sociaux, vidéo et documents. Un champ vide est masqué sur le site.'
    editor:
      preview: false
    delete: false
    files:
      - name: site
        label: 'Coordonnées, réseaux et médias'
        file: src/data/settings.json
        format: json
        fields:
          - label: Coordonnées
            name: contact
            widget: object
            collapsed: false
            fields:
              - { label: Téléphone, name: phone, widget: string, required: false, pattern: ['^(\+?[\d ]{8,20})?$', 'Numéro au format international, ex. +225 07 00 00 00 00'], hint: 'Ex. : +225 07 00 00 00 00' }
              - { label: 'Second téléphone', name: phone2, widget: string, required: false, pattern: ['^(\+?[\d ]{8,20})?$', 'Numéro au format international, ex. +225 07 00 00 00 00'], hint: 'Numéro complet avec l’indicatif. Ex. : +216 28 00 00 00' }
              - { label: WhatsApp, name: whatsapp, widget: string, required: false, pattern: ['^(\+?[\d ]{8,20})?$', 'Numéro au format international, ex. +225 07 00 00 00 00'], hint: 'Active les boutons WhatsApp du site. Ex. : +225 07 00 00 00 00' }
              - { label: Email, name: email, widget: string, required: false, pattern: ['^([^@\s]+@[^@\s]+\.[^@\s]+)?$', 'Adresse e-mail invalide'], hint: 'Ex. : contact@gcg-ci.com' }
              - { label: Adresse, name: address, widget: string, required: false, hint: 'Ex. : Abidjan, Cocody Riviera 3, rue …' }
              - { label: 'Lien Google Maps', name: mapsUrl, widget: string, required: false, hint: 'Lien « Partager » de Google Maps. Ex. : https://maps.app.goo.gl/…' }
              - { label: Horaires, name: hours, widget: string, required: false, hint: 'Le fuseau (GMT, heure d’Abidjan) est ajouté automatiquement. Ex. : Lun – Ven, 8 h – 17 h' }
              - { label: 'Horaires en anglais', name: hours_en, widget: string, required: false, hint: 'Ex. : Mon – Fri, 8 am – 5 pm' }
              - { label: 'Ouverture (pour Google)', name: opens, widget: string, required: false, pattern: ['^(([01]\d|2[0-3]):[0-5]\d)?$', 'Format 24 h : 08:30'], hint: 'Heure d’ouverture au format 24 h, identique à la fiche Google. Ex. : 08:30' }
              - { label: 'Fermeture (pour Google)', name: closes, widget: string, required: false, pattern: ['^(([01]\d|2[0-3]):[0-5]\d)?$', 'Format 24 h : 17:30'], hint: 'Ex. : 17:30' }
              - label: 'Jours d’ouverture (pour Google)'
                name: days
                widget: select
                multiple: true
                required: false
                hint: 'Les horaires ne sont annoncés à Google que si les jours sont cochés, comme sur la fiche Google Business Profile.'
                options:
                  - { label: Lundi, value: Monday }
                  - { label: Mardi, value: Tuesday }
                  - { label: Mercredi, value: Wednesday }
                  - { label: Jeudi, value: Thursday }
                  - { label: Vendredi, value: Friday }
                  - { label: Samedi, value: Saturday }
                  - { label: Dimanche, value: Sunday }
              - { label: 'Latitude du siège', name: latitude, widget: string, required: false, pattern: ['^(-?\d{1,2}[.,]\d{3,})?$', 'Nombre décimal, ex. 5.123456'], hint: 'Google Maps : clic droit sur le repère du siège, puis cliquer sur les coordonnées pour les copier ; la première valeur.' }
              - { label: 'Longitude du siège', name: longitude, widget: string, required: false, pattern: ['^(-?\d{1,3}[.,]\d{3,})?$', 'Nombre décimal, ex. -4.123456'], hint: 'La seconde valeur des coordonnées copiées.' }
          - label: Réseaux sociaux
            name: social
            widget: object
            collapsed: false
            hint: 'Adresse complète de chaque page. Les QR codes de la page Partager sont générés automatiquement.'
            fields:
              - { label: Instagram, name: instagram, widget: string, required: false, hint: 'Ex. : https://www.instagram.com/gcg.ci' }
              - { label: Facebook, name: facebook, widget: string, required: false, hint: 'Ex. : https://www.facebook.com/gcg.ci' }
              - { label: LinkedIn, name: linkedin, widget: string, required: false }
              - { label: TikTok, name: tiktok, widget: string, required: false }
              - { label: YouTube, name: youtube, widget: string, required: false }
          - label: Médias
            name: media
            widget: object
            collapsed: false
            fields:
              - { label: 'Vidéo de présentation', name: videoUrl, widget: string, required: false, hint: 'Lien YouTube ou Vimeo, sous-titrée en français et en anglais. Affichée sur la page À propos. Ex. : https://youtu.be/…' }
          - label: Documents à télécharger
            label_singular: document
            name: documents
            widget: list
            required: false
            summary: '{{fields.title}} ({{fields.lang}}, {{fields.date}})'
            hint: 'PDF de 10 Mo maximum (portfolio, présentation pour appels d’offres). La taille est affichée automatiquement.'
            fields:
              - { label: Titre, name: title, widget: string, hint: 'Ex. : Portfolio GCG' }
              - { label: 'Titre en anglais', name: title_en, widget: string, hint: 'Ex. : GCG portfolio' }
              - { label: Langue du document, name: lang, widget: select, options: [{ label: Français, value: fr }, { label: Anglais, value: en }] }
              - { label: 'Version (AAAA-MM)', name: date, widget: string, pattern: ['^\d{4}-\d{2}$', 'Format : 2026-10'], hint: 'Ex. : 2026-10' }
              - { label: Fichier PDF, name: file, widget: file, media_folder: /public/documents, public_folder: /documents, choose_url: false }
